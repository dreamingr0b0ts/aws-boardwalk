# Monthly cost-figure refresh (3rd of each month).
#
# Queries Cost Explorer for the prior month's metered usage and rewrites the
# marker-tagged spots on the company site and demo hub, then opens a PR --
# never a direct push, so a human reads the number before it publishes.
# Merging the PR triggers publish-sites.yml, which syncs the HTML to S3.
#
# The ops-gh-site role is narrow (Cost Explorer read + site publish) and only
# trusts main-branch workflow runs. Note: PRs opened with GITHUB_TOKEN do not
# trigger the terraform.yml PR checks; the merge push runs everything as usual.

name: update-costs

on:
  schedule:
    - cron: "0 13 3 * *" # 13:00 UTC on the 3rd, after the prior month settles
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: update-costs
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ops-gh-site
          aws-region: ${{ env.AWS_REGION }}

      - name: Refresh cost figures from Cost Explorer
        run: |
          pip install --quiet boto3
          python3 tools/update_monthly_costs.py | tee /tmp/pr-body.md

      - name: Open PR if figures changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Figures already current; nothing to do."
            exit 0
          fi
          MONTH=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          BRANCH="costs/$MONTH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "Update published cost figures for $MONTH"
          git push -u origin "$BRANCH" --force
          gh pr create \
            --title "Monthly cost figure refresh: $MONTH" \
            --body-file /tmp/pr-body.md \
            --base main --head "$BRANCH"
