# Nightly demo-window sweep for the deploy-demo-teardown planks (8 security,
# 9 network, 11 relational registry). Their demo/ roots bill by the hour or
# day and are driven by local `make demo` / `make teardown` — this workflow is
# the safety net for a forgotten teardown: every night it checks each demo
# root's state and, if a window was left open, runs that plank's own
# `make teardown` (final evidence snapshot → terraform destroy → status flip).
#
# Deliberately DESTROY-ONLY. The demo roots stay out of the apply matrix in
# terraform.yml because CI applying them would silently re-start billing; a
# sweep that can only tear down cannot re-create anything that bills, so it
# honors the same rule from the other side. workflow_dispatch doubles as a
# remote kill switch when the owner is away from the machine.
#
# 09:00 UTC is the boardwalk's standing reset hour (nightly data reseeds run
# then too), so the worst case for a forgotten window is about one day.

name: demo sweep

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

# Nothing by default; the one job states what it needs.
permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  sweep:
    name: sweep (${{ matrix.dir }})
    environment: prod # same protection + OIDC subject the apply role trusts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dir: [security-posture, network-blueprint, relational-registry]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.10"
          # No wrapper: the Makefiles capture `terraform output -raw` values
          # in command substitutions, which the wrapper's echo would corrupt.
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ops-gh-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: tear down if a demo window was left open
        working-directory: ${{ matrix.dir }}
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=aws-boardwalk-tfstate-${{ vars.AWS_ACCOUNT_ID }}"
          terraform -chdir=demo init -input=false \
            -backend-config="bucket=aws-boardwalk-tfstate-${{ vars.AWS_ACCOUNT_ID }}"
          # Read the state on its own line, so a failed read fails this step.
          # (Piping it into wc hid the failure: a broken backend counted as
          # "0 resources", printed "nothing to sweep", and exited 0 while the
          # stack kept billing.) Captured rather than piped, so there is also
          # no reader to SIGPIPE terraform.
          STATE=$(terraform -chdir=demo state list)
          COUNT=$(printf '%s' "$STATE" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "demo stack already torn down; nothing to sweep"
            exit 0
          fi
          echo "demo stack left up with $COUNT resources — sweeping"
          make teardown
