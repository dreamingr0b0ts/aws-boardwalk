# The boardwalk pipeline (plank 10):
#   PR      → fmt + validate + Checkov/Trivy scans + read-only terraform plan
#   main    → the same, then terraform apply through the "prod" environment
#
# GitHub exchanges its OIDC token for short-lived AWS credentials — there are
# no stored AWS keys in this repo or its settings. The plan role is read-only;
# the apply role is only assumable by jobs that passed the prod environment.
#
# Owner approval is a repo-settings toggle (prod environment → required
# reviewers), currently OFF: pushes to main apply automatically. When it is
# re-enabled it prompts once per matrix leg (~15 clicks per push) — accept
# that cost. A single-gate variant (no-op gate job holds the environment,
# matrix needs it) was tried and reverted on 2026-07-21: it required the
# apply role to trust ref:refs/heads/main, which moved approval enforcement
# out of IAM and let ANY main-branch job (incl. the scan job's third-party
# actions) reach PowerUserAccess. The environment stays on the matrix legs.
#
# Three rules keep other people's code away from cloud credentials:
#   1. Only the jobs that talk to AWS (plan, apply) may request an OIDC token.
#      The scan and build jobs run third-party scanners and npm packages, so
#      they get a read-only checkout and nothing else.
#   2. Lambda bundles are built once, in the build job, with npm install
#      scripts disabled, and handed to plan/apply as an artifact. No package
#      code runs in a job that holds, or could mint, AWS credentials.
#   3. Every action is pinned to a commit SHA (the tag it was taken from is in
#      the trailing comment). A tag can be moved to different code; a SHA
#      cannot. To update one, resolve the new tag with
#      `git ls-remote --tags https://github.com/<owner>/<repo>` and replace
#      both the SHA and the comment.

name: terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Nothing by default; each job states what it needs.
permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  scan:
    name: security scan (Checkov + Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkov (Terraform misconfigurations)
        uses: bridgecrewio/checkov-action@3f0caf0c3aa9f56ade6b49f6e60b63aaeafb75a3 # v12.3141.0
        with:
          directory: .
          config_file: .checkov.yaml

      - name: Trivy (IaC + dependency vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  build:
    name: build lambda bundles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every plank with a backend/package.json bundles the same way
      # (esbuild → backend/dist/<handler>/). --ignore-scripts: a dependency's
      # install hook is arbitrary code, and esbuild does not need its own.
      - name: Bundle every plank's handlers
        run: |
          for pkg in */backend/package.json; do
            dir=$(dirname "$pkg")
            echo "::group::$dir"
            (cd "$dir" && npm ci --ignore-scripts --no-fund --no-audit && npm run build)
            echo "::endgroup::"
          done

      # Paths are kept relative to the workspace root (<plank>/backend/dist/…),
      # so downloading into the root puts each bundle where terraform's
      # archive_file expects it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-bundles
          path: "*/backend/dist"
          if-no-files-found: error
          retention-days: 7

  plan:
    name: plan (${{ matrix.dir }})
    # Fork PRs get no cloud credentials: the OIDC trust names this repo only.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # security-posture, network-blueprint, and relational-registry cover
        # only their always-on infra/ roots; their demo/ roots (daily/hourly-
        # billing stacks — incl. plank 11's Aurora cluster) are deliberately
        # NOT in this matrix — deploy-demo-teardown is local-only via make.
        dir: [platform, modern-web-app, genai-assistant, doc-processing, event-mesh, data-lake, api-platform, container-works, security-posture, network-blueprint, relational-registry, model-workbench, demo-hub, company-site, devops-sre]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: lambda-bundles
          path: .

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.10"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ops-gh-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform fmt / init / validate / plan
        working-directory: ${{ matrix.dir }}
        run: |
          TF_DIR=$([ -d infra ] && echo infra || echo .) # platform/ has no infra subdir
          terraform -chdir=$TF_DIR fmt -check -recursive
          terraform -chdir=$TF_DIR init -input=false \
            -backend-config="bucket=aws-boardwalk-tfstate-${{ vars.AWS_ACCOUNT_ID }}"
          terraform -chdir=$TF_DIR validate
          TF_VAR_state_bucket="aws-boardwalk-tfstate-${{ vars.AWS_ACCOUNT_ID }}" \
            terraform -chdir=$TF_DIR plan -input=false -lock-timeout=120s -out=tfplan

  apply:
    name: apply (${{ matrix.dir }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [scan, build, plan]
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1 # platform first, then planks in dependency order
      matrix:
        # security-posture + network-blueprint + relational-registry:
        # always-on infra/ roots only (see plan matrix note)
        dir: [platform, modern-web-app, genai-assistant, doc-processing, event-mesh, data-lake, api-platform, container-works, security-posture, network-blueprint, relational-registry, model-workbench, demo-hub, company-site, devops-sre]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same bundles the plan legs saw, built by the credential-free job.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: lambda-bundles
          path: .

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.10"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ops-gh-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform apply
        working-directory: ${{ matrix.dir }}
        run: |
          TF_DIR=$([ -d infra ] && echo infra || echo .) # platform/ has no infra subdir
          terraform -chdir=$TF_DIR init -input=false \
            -backend-config="bucket=aws-boardwalk-tfstate-${{ vars.AWS_ACCOUNT_ID }}"
          TF_VAR_state_bucket="aws-boardwalk-tfstate-${{ vars.AWS_ACCOUNT_ID }}" \
            terraform -chdir=$TF_DIR apply -input=false -lock-timeout=120s -auto-approve
